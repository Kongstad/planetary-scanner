services:
  reference-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planetary_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-planetary_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planetary_scanner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reference-db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  reference-db-data: